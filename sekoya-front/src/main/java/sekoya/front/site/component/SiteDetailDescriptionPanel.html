<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<div wicket:id="editPopup" />
	
	<div class="card card-main">
		<div class="card-header">
			<div class="card-header-title">
				<wicket:message key="site.detail.description.title" />
			</div>
		</div>
		<div class="card-body">
			<div class="row g-3">
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.information" />
					</div>
					<div class="row row-description">
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.site.typologie" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<span wicket:id="typologie" />
									</div>
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.site.chiffreAffaires" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<span wicket:id="chiffreAffaires" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.localisation" />
					</div>
					<div class="row row-description">
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.common.adresse" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<div wicket:id="adresse" />
									</div>
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.site.localisation.coordonneesGeographiques" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<span wicket:id="localisation" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.littoral" />
					</div>
					<div class="row row-description">
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-8">
									<div class="description-label">
										<wicket:message key="business.site.littoral.localisationLittoral.long" />
									</div>
								</div>
								<div class="col-md-4">
									<div class="description-value">
										<span wicket:id="localisationLittoral" />
									</div>
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-8">
									<div class="description-label">
										<wicket:message key="business.site.littoral.zoneSubmersible.long" />
									</div>
								</div>
								<div class="col-md-4">
									<div class="description-value">
										<span wicket:id="zoneSubmersible" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="user.common.wording.tracking" />
					</div>
					<div class="row row-description">
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.common.historyEventSummary.creation" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<span wicket:id="creation" />
									</div>
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-description-group description-group">
								<div class="col-md-4">
									<div class="description-label">
										<wicket:message key="business.common.historyEventSummary.modification" />
									</div>
								</div>
								<div class="col-md-8">
									<div class="description-value">
										<span wicket:id="modification" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div wicket:id="actionsContainer" class="card-action card-action-bottom">
				<div class="row row-action justify-content-end">
					<div wicket:enclosure-component="edit" class="col-auto">
						<button wicket:id="edit" class="btn btn-primary" type="button">
							<span class="fa fa-fw fa-pencil-alt" />
							<wicket:message key="common.action.edit" />
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
</html>
