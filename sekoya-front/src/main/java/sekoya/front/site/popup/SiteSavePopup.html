<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<div wicket:id="body">
		<form wicket:id="form">
			<div class="row g-3">
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.information" />
					</div>
					<div class="row row-form">
						<div class="col-12">
							<div class="row row-form-group form-group">
								<div class="col-md-4">
									<label wicket:for="nom" class="col-form-label form-label"><wicket:label /></label>
								</div>
								<div class="col-md-8">
									<input wicket:id="nom" class="form-control" type="text" />
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-form-group form-group">
								<div class="col-md-4">
									<label wicket:for="typologie" class="col-form-label form-label"><wicket:label /></label>
								</div>
								<div class="col-md-8">
									<select wicket:id="typologie" class="form-control" />
								</div>
							</div>
						</div>
						<div class="col-12">
							<div class="row row-form-group form-group">
								<div class="col-md-4">
									<label wicket:for="chiffreAffaires" class="col-form-label form-label"><wicket:label /></label>
								</div>
								<div class="col-md-8">
									<div class="input-group">
										<input wicket:id="chiffreAffaires" class="form-control" type="text" />
										<span class="input-group-text">
											<wicket:message key="common.unit.kiloEuros" />
										</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.localisation" />
					</div>
					<div class="row row-form">
						<div class="col-12">
							<form wicket:id="geocodageSearchForm">
								<div class="input-group">
									<span class="input-group-text">
										<span class="fa fa-fw fa-location-dot" />
									</span>
									<div class="form-floating">
										<input wicket:id="term" class="form-control" type="text">
										<label wicket:for="term"><wicket:label /></label>
									</div>
								</div>
							</form>
						</div>
						<div wicket:id="geocodageChoicesContainer" class="col-12">
							<div class="row row-form">
								<div wicket:enclosure-component="choice" class="col-12">
									<div wicket:id="choice">
										<div class="list-group list-group-radio">
											<div wicket:id="choices" class="position-relative">
												<input wicket:id="item" class="form-check-input position-absolute top-50 start-0 ms-3 fs-5" type="radio">
												<label wicket:for="item" class="list-group-item py-3 ps-7"><wicket:label /></label>
											</div>
										</div>
									</div>
								</div>
								<div wicket:id="noResultContainer" class="col-12">
									<div class="alert alert-light">
										<wicket:message key="site.save.localisation.geocodage.choices.noResult" />
									</div>
								</div>
								<div wicket:id="errorContainer" class="col-12">
									<div class="alert alert-warning">
										<wicket:message key="site.save.localisation.geocodage.choices.error" />
									</div>
								</div>
							</div>
						</div>
						<div wicket:id="adresseContainer" class="col-12">
							<div class="row row-form">
								<div class="col-12">
									<div class="row row-form-group form-group">
										<div class="col-md-4">
											<label wicket:for="adresse1" class="col-form-label form-label"><wicket:label /></label>
										</div>
										<div class="col-md-8">
											<input wicket:id="adresse1" class="form-control" type="text" />
										</div>
									</div>
								</div>
								<div class="col-12">
									<div class="row row-form-group form-group">
										<div class="col-md-4">
											<label wicket:for="adresse2" class="col-form-label form-label"><wicket:label /></label>
										</div>
										<div class="col-md-8">
											<input wicket:id="adresse2" class="form-control" type="text" />
										</div>
									</div>
								</div>
								<div class="col-12">
									<div class="row row-form-group form-group">
										<div class="col-md-4">
											<label wicket:for="codePostal" class="col-form-label form-label"><wicket:label /></label>
										</div>
										<div class="col-md-8">
											<input wicket:id="codePostal" class="form-control" type="text" />
										</div>
									</div>
								</div>
								<div class="col-12">
									<div class="row row-form-group form-group">
										<div class="col-md-4">
											<label wicket:for="commune" class="col-form-label form-label"><wicket:label /></label>
										</div>
										<div class="col-md-8">
											<select wicket:id="commune" class="form-control" />
										</div>
									</div>
								</div>
								<div class="col-12">
									<div class="row row-form-group form-group">
										<div class="col-md-4">
											<label wicket:for="localisation" class="col-form-label form-label"><wicket:label /></label>
										</div>
										<div class="col-md-8">
											<input wicket:id="localisation" class="form-control" type="text" />
											<div class="form-text">
												<wicket:message key="site.save.localisation.localisation.help" />
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div wicket:id="littoral" class="col-12">
					<div class="heading-section">
						<wicket:message key="site.common.wording.littoral" />
					</div>
					<div class="row row-form">
						<div class="col-12">
							<div wicket:id="localisationLittoral" class="row row-form-group form-group">
								<div class="col-md-8">
									<span class="col-form-label form-label"><wicket:message key="business.site.littoral.localisationLittoral.long" /></span>
								</div>
								<div class="col-md-4">
									<div class="form-check form-check-inline">
										<input wicket:id="true" class="form-check-input" type="radio" />
										<label wicket:for="true" class="form-check-label"><wicket:label /></label>
									</div>
									<div class="form-check form-check-inline">
										<input wicket:id="false" class="form-check-input" type="radio" />
										<label wicket:for="false" class="form-check-label"><wicket:label /></label>
									</div>
								</div>
							</div>
							<div wicket:id="zoneSubmersible" class="row row-form-group form-group">
								<div class="col-md-8">
									<span class="col-form-label form-label"><wicket:message key="business.site.littoral.zoneSubmersible.long" /></span>
								</div>
								<div class="col-md-4">
									<div class="form-check form-check-inline">
										<input wicket:id="true" class="form-check-input" type="radio" />
										<label wicket:for="true" class="form-check-label"><wicket:label /></label>
									</div>
									<div class="form-check form-check-inline">
										<input wicket:id="false" class="form-check-input" type="radio" />
										<label wicket:for="false" class="form-check-label"><wicket:label /></label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div wicket:id="footer">
		<button wicket:id="cancel" class="btn btn-outline-secondary" type="button">
			<wicket:message key="common.action.cancel" />
		</button>
		<button wicket:id="save" class="btn btn-success" type="button">
			<span class="fa fa-fw fa-check" />
			<wicket:message key="common.action.save" />
		</button>
	</div>
</wicket:panel>
</html>
