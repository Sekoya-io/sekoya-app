<?xml version="1.0" encoding="UTF-8"?>
<!doctype html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd" wicket:id="htmlElement">
	<head>
		<title wicket:id="headPageTitle" />
		
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=Edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="description" content="Sekoya">
		
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Sekoya" />
		<link rel="manifest" href="/site.webmanifest" />
		
		<wicket:header-items />
	</head>
	<body wicket:id="bodyElement">
		<aside wicket:id="sidebar" class="sidebar offcanvas offcanvas-start" tabindex="-1" />
		
		<div class="body-container">
			<header wicket:id="headerSection" class="header-section">
				<nav wicket:id="navbar" class="navbar navbar-app navbar-main navbar-expand-md" />
			</header>
			
			<main class="main-section">
				<div wicket:enclosure-component="announcements" class="main-header">
					<div wicket:id="announcements" class="header-alert-section header-alert-dismissible announcements-section" />
				</div>
				<div class="main-body">
					<div class="content-container">
						<div wicket:enclosure-component="breadCrumb" class="content-pre-header-section">
							<div class="content-pre-header-container">
								<div class="content-pre-header">
									<div wicket:id="breadCrumb" />
								</div>
							</div>
						</div>
						<wicket:child />
					</div>
				</div>
			</main>
		</div>
		
		<div wicket:id="feedback" data-placement="bottom" />
		
		<div wicket:id="bsBreakpoint" class="bs-breakpoint" />
	</body>
</html>
