<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<div class="card card-main">
		<div class="card-header">
			<div class="card-header-title">
				<wicket:message key="processus.save.aleas.title" />
			</div>
		</div>
		<div class="card-body">
			<form wicket:id="form">
				<div class="table-responsive">
					<table class="table table-hover table-striped">
						<thead>
							<tr class="headers">
								<th class="cell-w-300"><wicket:message key="business.alea.type" /></th>
								<th class="cell-w-300"><wicket:message key="business.alea.sensibilite" /></th>
								<th class="cell-w-300 d-none d-xl-table-cell"><wicket:message key="business.alea.impactPotentielBrut" /></th>
								<th class="cell-w-actions-1x cell-w-fit" />
							</tr>
						</thead>
						<tbody class="table-group-divider">
							<tr wicket:id="aleas">
								<wicket:container wicket:id="row" />
							</tr>
							<tr wicket:id="placeholder" class="empty-list">
								<td colspan="4"><wicket:message key="alea.common.count.zero" /></td>
							</tr>
						</tbody>
					</table>
				</div>
			</form>
		</div>
		<div wicket:id="add" class="card-body" />
	</div>
	
	<wicket:fragment wicket:id="rowFragment">
		<td class="cell-w-300">
			<span wicket:id="icon" class="fa fa-fw text-secondary" />
			<span wicket:id="type" />
		</td>
		<td class="cell-w-300">
			<div wicket:id="sensibilite" class="rating-badge-form-check rating-badge-form-check-alea-sensibilite">
				<wicket:container wicket:id="values" />
			</div>
		</td>
		<td class="cell-w-300 d-none d-xl-table-cell">
			<div wicket:id="impactPotentielBrut" />
		</td>
		<td class="cell-w-actions-1x cell-w-fit">
			<button wicket:id="delete" class="btn btn-danger" type="button" wicket:message="title:common.action.delete">
				<span class="fa fa-fw fa-trash" />
			</button>
		</td>
	</wicket:fragment>
	
	<wicket:fragment wicket:id="addFragment">
		<form wicket:id="add">
			<div class="row row-form align-items-center">
				<div class="col-lg-5 col-2xl-4">
					<select wicket:id="type" class="form-control" />
				</div>
				<div wicket:enclosure-component="sensibilite" class="col-lg-auto">
					<div wicket:id="sensibilite" class="rating-badge-form-check rating-badge-form-check-alea-sensibilite">
						<wicket:container wicket:id="values" />
					</div>
				</div>
			</div>
		</form>
	</wicket:fragment>
</wicket:panel>
</html>
