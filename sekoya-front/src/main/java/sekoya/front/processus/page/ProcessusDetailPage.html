<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:extend>
	<div class="content-header-section">
		<div class="content-header-container">
			<div class="content-header">
				<h1 wicket:id="title" class="content-header-title" />
				<div wicket:id="headerElementsSection" class="content-header-elements-section">
					<div class="row g-2 align-items-center">
						<div wicket:id="informationContainer" class="col-auto">
							<div class="row g-2 align-items-center">
								<div class="col-auto">
									<span wicket:id="enabled" class="fs-6" />
								</div>
							</div>
						</div>
						<div wicket:id="actionsContainer" class="col-auto ms-auto">
							<div class="row g-2 align-items-center">
								<div wicket:enclosure-component="edit" class="col-auto">
									<button wicket:id="edit" class="btn btn-primary" type="button">
										<span class="fa fa-fw fa-pencil-alt" />
										<wicket:message key="common.action.edit" />
									</button>
								</div>
								<div wicket:enclosure-component="enable" class="col-auto">
									<button wicket:id="enable" class="btn btn-success" type="button">
										<span class="fa fa-fw fa-check" />
										<wicket:message key="common.action.enable" />
									</button>
								</div>
								<div wicket:enclosure-component="disable" class="col-auto">
									<button wicket:id="disable" class="btn btn-danger" type="button">
										<span class="fa fa-fw fa-times" />
										<wicket:message key="common.action.disable" />
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="content-body-section">
		<div class="content-body-container">
			<div class="content-body">
				<div class="row g-4">
					<div wicket:id="description" class="col-lg-6" />
					<div wicket:id="aleas" class="col-12" />
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
</html>
