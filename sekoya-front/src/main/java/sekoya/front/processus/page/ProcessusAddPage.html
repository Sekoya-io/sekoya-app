<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:extend>
	<div wicket:id="header" />
	<form wicket:id="form">
		<div class="content-body-section">
			<div class="content-body-container">
				<div class="content-body">
					<div class="row g-4">
						<div wicket:id="description" class="col-lg-6" />
						<div wicket:id="aleas" class="col-12" />

				</div>
			</div>
		</div>
		<div class="content-footer-section sticky-bottom">
			<div class="content-footer-container">
				<div wicket:id="footer" class="content-footer" />
			</div>
		</div>
	</form>
</wicket:extend>
</html>
