<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<form wicket:id="form">
		<div class="row row-form">
			<div class="form-group col-sm-6 col-md-3 col-lg-2">
				<label wicket:for="scenario" class="visually-hidden"><wicket:label /></label>
				<select wicket:id="scenario" class="form-control" />
			</div>
			<div class="form-group col-sm-6 col-md-3 col-lg-2">
				<label wicket:for="horizon" class="visually-hidden"><wicket:label /></label>
				<select wicket:id="horizon" class="form-control" />
			</div>
			<div class="form-group col-sm-6 col-md-4 col-lg-3">
				<div class="form-check form-switch form-control-plaintext">
					<input wicket:id="applyProcessus" class="form-check-input" type="checkbox" role="switch" />
					<label wicket:for="applyProcessus" class="form-check-label"><wicket:label /></label>
				</div>
			</div>
		</div>
	</form>
</wicket:panel>
</html>
