<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<div class="row g-3">
		<div class="col-12">
			<div class="fw-semibold fs-4 text-brand">
				<span class="fa fa-fw fa-tornado text-secondary" />
				<wicket:message key="simulation.common.offcanvas.processus.aleas.title" />
			</div>
			<div class="text-secondary text-uppercase small">
				<wicket:message key="simulation.common.offcanvas.processus.aleas.subtitle" />
			</div>
		</div>
		<div class="col-12">
			<div wicket:enclosure-component="aleas" class="list-group list-group-radio">
				<div wicket:id="aleas" class="position-relative">
					<div class="list-group-item py-2 px-3">
						<div class="row g-3 align-items-center">
							<div class="col-auto">
								<div class="bg-body-secondary p-1 rounded-3">
									<span wicket:id="icon" class="fa fa-fw fa-lg text-brand" />
								</div>
							</div>
							<div class="col">
								<div wicket:id="alea" class="fw-bold" />
							</div>
							<div class="col-auto">
								<div wicket:id="risque" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<div wicket:id="placeholder" class="alert alert-warning">
				<div class="mb-2">
					<wicket:message key="simulation.common.offcanvas.processus.aleas.help.empty" />
				</div>
				<a wicket:id="add" class="btn btn-primary">
					<span class="fa fa-fw fa-plus" />
					<wicket:message key="simulation.common.offcanvas.processus.aleas.help.empty.add" />
				</a>
			</div>
		</div>
	</div>
</wicket:panel>
</html>
