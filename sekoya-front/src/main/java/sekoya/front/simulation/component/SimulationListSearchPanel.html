<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:panel>
	<form wicket:id="form">
		<div class="row row-form">
			<div class="col-lg-12">
				<div class="row row-form align-items-center">
					<div class="form-group col-lg-4 col-2xl-3">
						<label wicket:for="scenario" class="visually-hidden"><wicket:label /></label>
						<select wicket:id="scenario" class="form-control" />
					</div>
					<div class="form-group col-lg-4 col-2xl-3">
						<label wicket:for="horizon" class="visually-hidden"><wicket:label /></label>
						<select wicket:id="horizon" class="form-control" />
					</div>
					<div class="form-group col-md-8 col-lg-4 col-2xl-3">
						<div class="form-check form-switch form-control-plaintext">
							<input wicket:id="applyProcessus" class="form-check-input" type="checkbox" role="switch" />
							<label wicket:for="applyProcessus" class="form-check-label"><wicket:label /></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-12">
				<div class="row row-form align-items-center">
					<div class="form-group col-lg-4 col-2xl-3">
						<label wicket:for="nom" class="visually-hidden"><wicket:label /></label>
						<input wicket:id="nom" class="form-control" type="text" />
					</div>
					<div class="form-group col-lg-4 col-2xl-3">
						<label wicket:for="typologie" class="visually-hidden"><wicket:label /></label>
						<select wicket:id="typologie" class="form-control" />
					</div>
					<div class="form-group col-lg-4 col-2xl-3">
						<label wicket:for="region" class="visually-hidden"><wicket:label /></label>
						<select wicket:id="region" class="form-control" />
					</div>
				</div>
			</div>
		</div>
	</form>
</wicket:panel>
</html>
