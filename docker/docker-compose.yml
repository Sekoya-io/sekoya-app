name: sekoya

services:
  bdd:
    image: "igloo-containers.tools.kobalt.fr/containers/postgres-igloo:18"
    ports:
      - "127.0.0.1:2532:5432"
    volumes:
      - sekoya-bdd:/var/lib/postgresql
    environment:
      - POSTGRES_DB=sekoya
      - POSTGRES_USER=sekoya
      - POSTGRES_HOST_AUTH_METHOD=trust
      - TZ=Europe/Paris
      - PGTZ=Europe/Paris

volumes:
 sekoya-bdd: