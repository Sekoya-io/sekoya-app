##
## Basic configuration loaded from ConfigurationPropertiesUrlConstants.JPA_COMMON
##

configurationType=development
environment=qualification

spring.jpa.properties.hibernate.default_schema=sekoya_test
spring.flyway.defaultSchema=sekoya_test
db.schema=sekoya_test

spring.flyway.clean-disabled=false

testContainer.database.name=sekoya_test
testContainer.database.userName=sekoya_test
testContainer.database.password=sekoya_test
testContainer.database.exposedPorts=5432
# nécessite le contournement PostgisTestContainerConfiguration pour que l'image soit considérée compatible postgres
testContainer.database.dockerImageName=igloo-containers.tools.kobalt.fr/containers/postgis-igloo:18-3.6

data.path=${TEST_DATA_PATH:/data/services/test/sekoya}

migration.init.enabled=false

task.startMode=manual

igloo.system.roles=ROLE_SYSTEM ROLE_ADMIN ROLE_AUTHENTICATED ROLE_ANONYMOUS

